version: "2"

run:
  build-tags: []
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - noctx
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    paths:
      # Vue SPA sources plus the stray Go package npm drops under node_modules.
      - frontend
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx
      # ST1005 (capitalized error strings) conflicts with user-facing API error
      # copy that handlers write verbatim into JSON responses.
      - linters:
          - staticcheck
        text: "ST1005:"
      # ST1018 wants U+200C (the Persian zero-width non-joiner) escaped. The
      # Persian copy needs it between word parts, and "\u200c" in the middle
      # of every sentence would make that copy unreadable to whoever edits it.
      # Only the notices hold that copy; everywhere else ST1018 still guards
      # against format characters, bidi overrides included.
      - path: internal/notices/
        linters:
          - staticcheck
        text: "ST1018:"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nx-panel/notif
  exclusions:
    paths:
      - frontend
